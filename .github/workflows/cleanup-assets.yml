name: Remove stray release assets

# One-off cleanup for #35: v3.0.0, v3.1.0 and v3.2.0 were published with the
# Docker build record (*.dockerbuild) next to the real downloads. Since 3.2.1
# the release workflow no longer attaches it. This deletes only files whose
# name ends in .dockerbuild, only on the releases given. Remove this workflow
# once it has run.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to clean, space-separated"
        required: true
        default: "v3.0.0 v3.1.0 v3.2.0"

permissions:
  contents: write # deleting release assets

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete *.dockerbuild assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.assets[] | select(.name | endswith(".dockerbuild")) | "\(.id) \(.name)"')"
            if [ -z "$assets" ]; then
              echo "$tag: nothing to remove"
              continue
            fi
            while read -r id name; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
              echo "$tag: deleted $name"
            done <<< "$assets"
          done
          echo "Left on each release:"
          for tag in $TAGS; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"\(.tag_name): \([.assets[].name] | join(", "))"'
          done
