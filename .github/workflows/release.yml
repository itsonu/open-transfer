name: Release

# Two ways to release:
#   1. Push a tag:            git tag v2.1.0 && git push origin v2.1.0
#   2. Actions → Release → "Run workflow" on master with tag "v2.1.0"
#      (creates the tag on that commit; handy when you can't push tags).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v2.1.0 (must match __version__)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  python:
    name: Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          python - <<'PY'
          import os, re, sys
          version = re.search(r'__version__ = "(.+?)"', open("src/open_transfer/__init__.py").read())[1]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match __version__ {version}")
          print(f"Releasing {tag}")
          PY
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Same builds as the CI "app" job. Attached to the release:
        #   open-transfer-linux-x64.tar.gz        command-line app
        #   open-transfer-windows-x64.exe         desktop app (window)
        #   open-transfer-windows-x64-cli.exe     command-line app
        #   open-transfer-macos-arm64.dmg         desktop app, Apple silicon
        #   open-transfer-macos-arm64-cli.tar.gz  command-line app, Apple silicon
        #   open-transfer-macos-x64.dmg           desktop app, Intel Mac
        include:
          - { os: ubuntu-latest, name: linux-x64, cli: open-transfer-linux-x64, desktop: false }
          - { os: windows-latest, name: windows-x64, cli: open-transfer-windows-x64-cli, desktop: true }
          - { os: macos-latest, name: macos-arm64, cli: open-transfer-macos-arm64-cli, desktop: true, desktop-flags: --require-window }
          - { os: macos-15-intel, name: macos-x64, cli: "", desktop: true, desktop-flags: --require-window }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the command-line app
        if: matrix.cli != ''
        run: python scripts/build_app.py
      - name: Package the command-line app
        if: matrix.cli != ''
        shell: bash
        # .tar.gz keeps the executable bit on macOS/Linux; Windows gets the .exe as-is.
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv open-transfer.exe "${{ matrix.cli }}.exe"
          else
            tar -czf "${{ matrix.cli }}.tar.gz" open-transfer && rm open-transfer
          fi
      - name: Install the WebView2 runtime
        if: matrix.desktop && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process $installer -ArgumentList "/silent", "/install" -Wait
      # Builds and smoke-tests the desktop app (macOS: makes and tests the .dmg).
      - name: Build the desktop app
        if: matrix.desktop
        run: python scripts/build_app.py --desktop ${{ matrix.desktop-flags }}
      - name: Package the desktop app
        if: matrix.desktop && runner.os == 'Windows'
        shell: bash
        run: mv "dist/Open Transfer.exe" "dist/open-transfer-${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: dist/open-transfer-*
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  # TODO(android): the Android APK job goes here (added separately; not built yet).
  # Upload the APK with actions/upload-artifact@v7 (e.g. name: binary-android,
  # file: open-transfer-android.apk) and add the job to `publish.needs` below:
  # publish downloads every artifact of the run and attaches all of them.

  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-transfer
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: GitHub release
    # TODO(android): add the Android APK job to this list.
    needs: [python, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Open Transfer ${{ env.TAG }}
          files: artifacts/*
          generate_release_notes: true
