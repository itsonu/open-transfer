name: Release

# Two ways to release:
#   1. Push a tag:            git tag v2.1.0 && git push origin v2.1.0
#   2. Actions → Release → "Run workflow" on master with tag "v2.1.0"
#      (creates the tag on that commit; handy when you can't push tags).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v2.1.0 (must match __version__)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  python:
    name: Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          python - <<'PY'
          import os, re, sys
          version = re.search(r'__version__ = "(.+?)"', open("src/open_transfer/__init__.py").read())[1]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match __version__ {version}")
          print(f"Releasing {tag}")
          PY
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/build_app.py
      - name: Package
        shell: bash
        # .tar.gz keeps the executable bit on macOS/Linux; Windows gets the .exe as-is.
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv open-transfer.exe "open-transfer-${{ matrix.name }}.exe"
          else
            tar -czf "open-transfer-${{ matrix.name }}.tar.gz" open-transfer && rm open-transfer
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: dist/open-transfer-*

  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-transfer
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: GitHub release
    needs: [python, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Open Transfer ${{ env.TAG }}
          files: artifacts/*
          generate_release_notes: true
