name: Android

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "src/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy runs pip and compiles .pyc files with a build-machine Python whose
      # major.minor must match the app's (3.12). It finds `python3.12` on the PATH.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      # Optional release signing: set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets. Without them the release APK is
      # signed with the runner's debug key (installable, but not updatable across builds).
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No release key configured; signing with the debug key"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease testReleaseUnitTest --stacktrace

      - name: Collect APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk open-transfer-android.apk
          ls -la open-transfer-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: open-transfer-android
          path: open-transfer-android.apk
          if-no-files-found: error

  emulator-smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Open Transfer on the runner
        run: pip install ./

      - uses: actions/download-artifact@v8
        with:
          name: open-transfer-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and transfer a file
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/emulator_smoke.sh open-transfer-android.apk
