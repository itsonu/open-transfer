name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - name: JavaScript syntax
        run: node --check src/open_transfer/static/app.js && node --check site/site.js
      - name: Website builds with no broken local links
        run: python scripts/build_site.py

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e -v

  runner:
    name: One-command runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Start with run.sh
        if: runner.os != 'Windows'
        run: |
          ./run.sh --no-browser --no-qr --port 5055 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:5055/api/health && exit 0; sleep 1; done
          exit 1
      - name: Start with run.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process pwsh -PassThru -NoNewWindow `
            -ArgumentList "-NonInteractive", "-File", ".\run.ps1", "--no-browser", "--no-qr", "--port", "5055" `
            -RedirectStandardOutput runner.log -RedirectStandardError runner.err
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not $proc.HasExited) {
            try { Invoke-RestMethod -TimeoutSec 2 http://127.0.0.1:5055/api/health; exit 0 } catch { Start-Sleep 1 }
          }
          Write-Host "--- runner output ---"; Get-Content runner.log, runner.err -ErrorAction SilentlyContinue
          exit 1

  app:
    name: Standalone app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cli: base name of the command-line build's artifact ("" = don't build it).
        # desktop: build the windowed desktop app (Windows .exe, macOS .dmg).
        # desktop-flags: macOS runners always have a window server, so a native
        # window that fails to open there is a real bug, not a runner limitation.
        include:
          - { os: ubuntu-latest, name: linux-x64, cli: open-transfer-linux-x64, desktop: false }
          - { os: windows-latest, name: windows-x64, cli: open-transfer-windows-x64-cli, desktop: true }
          - { os: macos-latest, name: macos-arm64, cli: open-transfer-macos-arm64-cli, desktop: true, desktop-flags: --require-window }
          # GitHub's last Intel macOS image (x64).
          - { os: macos-15-intel, name: macos-x64, cli: "", desktop: true, desktop-flags: --require-window }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Builds dist/open-transfer[.exe] and smoke-tests it (starts it, calls /api/health).
      - name: Build the command-line app
        if: matrix.cli != ''
        run: python scripts/build_app.py
      - name: Package the command-line app
        if: matrix.cli != ''
        shell: bash
        # .tar.gz keeps the executable bit on macOS/Linux; Windows gets the .exe as-is.
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv open-transfer.exe "${{ matrix.cli }}.exe"
          else
            tar -czf "${{ matrix.cli }}.tar.gz" open-transfer && rm open-transfer
          fi
      # The desktop app's window is WebView2. Windows 11 ships it; make sure the
      # Server image has it too, so the smoke test can check the real window.
      - name: Install the WebView2 runtime
        if: matrix.desktop && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process $installer -ArgumentList "/silent", "/install" -Wait
      # Builds the desktop app, then runs it with --smoke-test: starts it, checks the
      # API and that the UI rendered in the native window (macOS: straight from the .dmg).
      - name: Build the desktop app
        if: matrix.desktop
        run: python scripts/build_app.py --desktop ${{ matrix.desktop-flags }}
      - name: Package the desktop app
        if: matrix.desktop && runner.os == 'Windows'
        shell: bash
        # build_app.py names the macOS disk image itself (open-transfer-macos-<arch>.dmg).
        run: mv "dist/Open Transfer.exe" "dist/open-transfer-${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: open-transfer-${{ matrix.name }}
          path: dist/open-transfer-*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    uses: ./.github/workflows/android.yml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t open-transfer:ci .
      - name: Smoke test
        run: |
          docker run -d --name ot -p 5000:5000 open-transfer:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/api/health && break; sleep 1; done
          echo "hello" | curl -sf -X POST -H "X-Filename: hello.txt" --data-binary @- http://127.0.0.1:5000/api/files
          curl -sf http://127.0.0.1:5000/files/hello.txt | grep -q hello
          docker logs ot
